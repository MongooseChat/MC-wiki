name: Deploy Pre-built Docs to Pages

on:
  push:
    branches: ["master"] # Matches your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points directly to the folder containing index.html
          path: 'docs/html' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
